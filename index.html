<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chúc bé 20-10</title>
  <meta name="description" content="Một lá thư nhỏ và một bó hoa dành cho em.">
  <meta property="og:title" content="Chúc bé 20-10">
  <meta property="og:description" content="Một lá thư nhỏ và một bó hoa dành cho em.">
  <meta name="theme-color" content="#f6cadb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="fall" aria-hidden="true"></div>

  <!-- 1. Màn khóa -->
  <section class="scene on" id="lock" aria-label="Nhập mật khẩu">
    <div class="lock-card" id="lockCard">
      <div class="lock-photo"><img id="coverImg" alt="Ảnh bìa"></div>
      <div class="pad">
        <div class="lock-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </div>
        <div class="lock-title">Nhập mật khẩu</div>
        <div class="dots" id="dots" aria-live="polite"></div>
        <div class="lock-hint" id="lockHint"></div>
        <div class="keys" id="keys"></div>
      </div>
    </div>
  </section>

  <!-- 2. Phong bì -->
  <section class="scene" id="envelope" aria-label="Phong bì">
    <div class="env-wrap" id="envWrap" role="button" tabindex="0" aria-label="Chạm để mở phong bì">
      <span class="env-back"></span>
      <span class="env-letter" id="envLetter"></span>
      <span class="pocket l"></span>
      <span class="pocket r"></span>
      <span class="pocket b"></span>
      <span class="env-flap"></span>
      <span class="env-seal" aria-hidden="true">♥</span>
    </div>
    <div class="env-hint">Chạm để mở <span class="h">♥</span></div>
  </section>

  <!-- 3. Lá thư -->
  <section class="scene" id="letter" aria-label="Lá thư">
    <article class="letter-paper">
      <div class="letter-date" id="letterDate"></div>
      <div class="letter-scroll" id="letterScroll" tabindex="0"></div>
      <div class="sticker" id="sticker"></div>
    </article>
    <button class="letter-cta" id="letterCta" disabled>Chạm vào thư để hiện hết nhé</button>
  </section>

  <!-- 4. Bó hoa -->
  <section class="scene" id="bouquet" aria-label="Bó hoa">
    <h1 class="bq-title" id="bqTitle"></h1>
    <p class="bq-note" id="bqNote"></p>
    <div class="bq" id="bq"></div>
    <div class="bq-actions">
      <span class="bq-hint">Chạm vào từng bông hoa nhé</span>
      <button class="link-btn" id="rereadBtn">Đọc lại thư</button>
    </div>
  </section>

  <div class="lb" id="lb" hidden>
    <figure class="lb-card" style="margin:0">
      <img id="lbImg" alt="">
    </figure>
  </div>

  <!-- Nút bật/tắt nhạc (tự hiện khi nhạc chạy) -->
  <button class="music-btn" id="musicBtn" aria-label="Nhạc nền" aria-pressed="false" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
  </button>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
